<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dua Belas Mangga Official</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        .foto-besar {
            max-width: 90vw; /* Lebar maksimal 90% dari lebar layar */
            max-height: 90vh; /* Tinggi maksimal 90% dari tinggi layar */
            object-fit: contain; /* Memastikan rasio foto tetap terjaga */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <!-- Ubah 'nama-file.jpg' sesuai dengan nama foto Anda -->
    <img src="/image/sahabat.jpeg" alt="Sahabat Selamanya" class="foto-besar">

</body>
</html>
